<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抽奖工具 · 小萝卜</title><link rel="stylesheet" href="/lottery/game.css"><script src="/events.js"></script><script src="/diagnostics.js"></script><script src="/lottery/tickets.js" defer></script><script src="/lottery/game.js" defer></script></head><body><main id="lottery-stage"><canvas id="lottery-canvas" width="1280" height="720" role="img" aria-label="抽奖工具，等待报名"></canvas><div id="scratch-controls" hidden><button id="scratch-reset" class="circle reset" aria-label="重新摆放签卡">↻</button><div class="top-controls"><button id="scratch-list" aria-label="奖项与历史">☷</button><button id="scratch-help" aria-label="玩法说明">?</button></div><div class="draw-controls"><button id="scratch-settings" class="circle settings">设定</button><button id="scratch-shake" class="circle shake">摇动</button><button id="scratch-draw" class="circle draw">抽奖</button></div><div id="scratch-result" hidden><button id="scratch-cancel">放回</button><button id="scratch-open">撕开</button></div><div id="scratch-accessible"><label for="scratch-card">指定签卡编号</label><input id="scratch-card" type="number" min="1" value="1"><button id="scratch-select">选中签卡</button></div></div></main><dialog id="scratch-dialog"><button id="scratch-close" aria-label="关闭">×</button><h2>刮刮乐 · 一番赏</h2><div class="dialog-tabs"><button data-ticket-tab="edit">奖项设定</button><button data-ticket-tab="list">剩余签卡</button><button data-ticket-tab="history">抽奖记录</button></div><form id="scratch-form"><p>每行填写奖项，可写「奶茶 * 5」，也可用「#A 惊喜大奖 * 1」指定奖级。最多 200 张。</p><textarea id="scratch-names" rows="8" maxlength="10000" placeholder="惊喜大奖 * 1&#10;奶茶一杯 * 5&#10;幸运贴纸 * 20" required></textarea><label class="remove-option"><input id="scratch-remove" type="checkbox" checked>抽中后移出这一张签卡</label><p class="source-tip">这里仅修改刮刮乐数据源，转盘和决斗分别保存。</p><button class="primary" type="submit">保存并摆放签卡</button></form><div id="scratch-items" hidden></div><div id="scratch-history" hidden></div><p id="scratch-dialog-error" role="alert"></p></dialog><div id="lottery-connection" role="status">正在连接控制台…</div><div id="lottery-announcement" role="status" aria-live="polite"></div></body></html>
